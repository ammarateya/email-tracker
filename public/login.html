<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Email Tracker</title><style>*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#f7f8fa;color:#111827;min-height:100vh;display:grid;place-items:center;margin:0}main{background:white;width:min(420px,calc(100% - 32px));padding:32px;border:1px solid #e5e7eb;border-radius:12px;box-shadow:0 10px 25px #1118270d}h1{font-size:24px;margin:0 0 8px}p{color:#6b7280;margin:0 0 24px}label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:7px;font:inherit}button{width:100%;padding:12px;background:#2563eb;color:white;border:0;border-radius:7px;font:inherit;font-weight:600;margin-top:22px;cursor:pointer}a{color:#2563eb}#message{color:#b91c1c;min-height:24px;margin-top:12px}#switch{display:block;text-align:center;margin-top:18px;font-size:14px}</style></head><body><main><h1 id="title">Sign in</h1><p id="intro">Track your emails with your own account.</p><form id="form"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><div id="inviteWrap" hidden><label id="inviteLabel">Invite code</label><input id="code" autocomplete="off"></div><button id="submit">Sign in</button></form><div id="message" role="alert"></div><a href="#" id="switch"></a></main><script>const qs=new URLSearchParams(location.search), invite=qs.get('invite');let mode=invite?'register':'login', setup=false;const $=id=>document.getElementById(id);async function state(){try{const r=await(await fetch('/api/auth/state')).json();if(r.user){location.replace('/');return}setup=r.setup;if(setup)mode='register';render()}catch{$('message').textContent='Cannot connect to server'}}function render(){$('title').textContent=mode==='login'?'Sign in':setup?'Create your admin account':'Create your account';$('intro').textContent=setup?'Enter the setup code provided during deployment.':mode==='register'?'Enter your invite code to join.':'Track your emails with your own account.';$('inviteWrap').hidden=mode==='login';$('inviteLabel').textContent=setup?'Setup code':'Invite code';$('code').required=mode==='register';$('code').value=invite||'';$('password').autocomplete=mode==='login'?'current-password':'new-password';$('password').minLength=mode==='login'?0:12;$('submit').textContent=mode==='login'?'Sign in':'Create account';$('switch').textContent=setup?'':mode==='login'?'Have an invite? Create an account':'Already have an account? Sign in'}$('switch').onclick=e=>{e.preventDefault();mode=mode==='login'?'register':'login';render()};$('form').onsubmit=async e=>{e.preventDefault();$('message').textContent='';$('submit').disabled=true;try{const r=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value,code:$('code').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Could not sign in');location.replace('/')}catch(err){$('message').textContent=err.message;$('submit').disabled=false}};state();</script></body></html>
